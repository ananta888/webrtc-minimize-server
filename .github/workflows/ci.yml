name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency graph
        run: npm audit --omit=dev
      - name: Install Chromium, Firefox and system dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Provide a synthetic audio clock for real Firefox AudioContext tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils ffmpeg
          pulseaudio -n --daemonize=yes --exit-idle-time=-1 \
            --load="module-native-protocol-unix" \
            --load="module-null-sink sink_name=webrtc_ci_audio rate=48000 channels=2"
          pactl set-default-sink webrtc_ci_audio
          pactl info > /dev/null
      - name: Run todo, unit, integration and browser gates
        run: npm run check
      - name: Generate production dependency SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > webrtc-minimize-server.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: webrtc-minimize-server-sbom
          path: webrtc-minimize-server.cdx.json
          if-no-files-found: error
          retention-days: 30

  machine-turn-dialog:
    name: Ananta dialog over authenticated TURN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEET_TEST_PROXY_IMAGE: node:22-alpine
      MEET_TEST_STUN_IMAGE: coturn/coturn:4.17.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Provide a synthetic Firefox audio clock
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils
          pulseaudio -n --daemonize=yes --exit-idle-time=-1 \
            --load="module-native-protocol-unix" \
            --load="module-null-sink sink_name=webrtc_ci_audio rate=48000 channels=2"
          pactl set-default-sink webrtc_ci_audio
          pactl info > /dev/null
      - name: Build the tested application and pull isolated fixture images
        run: |
          npm run build
          docker pull node:22-alpine
          docker pull coturn/coturn:4.17.0
      - name: Real Chromium and Firefox dialog over TURN UDP
        env:
          MACHINE_DIALOG_ICE_PATH: turn-udp
        run: node --test test/machine-dialog.browser.e2e.test.js
      - name: Real Chromium and Firefox dialog over TURN TCP
        env:
          MACHINE_DIALOG_ICE_PATH: turn-tcp
        run: node --test test/machine-dialog.browser.e2e.test.js

  macos-packager-lifecycle:
    name: macOS packager lifecycle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify real launchd and stock macOS maintenance tools
        env:
          RUN_MACOS_PACKAGER_LIFECYCLE: "1"
          EXPECT_MACOS_PACKAGER_ARCH: ${{ matrix.arch }}
        run: node scripts/live-native-packager-macos-lifecycle-gate.mjs

  docker:
    name: Docker build
    needs: [test, native-packager]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile local --env-file .env.local.example config --quiet
      - name: Create attestation-capable BuildKit builder
        run: |
          docker buildx create --driver docker-container --name webrtc-ci-builder --use
          docker buildx inspect --bootstrap
      - name: Build production OCI archive with provenance and SBOM
        run: |
          docker buildx build --build-arg SOURCE_REVISION=${{ github.sha }} \
            --build-arg SOURCE_TIMESTAMP="$(git show -s --format=%cI HEAD)" \
            --provenance=mode=max --sbom=true \
            --output type=oci,dest=/tmp/webrtc-minimize-server.oci.tar .
      - name: Export exact Docker native release artifacts
        run: |
          docker buildx build --target native-packager-release-export \
            --build-arg SOURCE_REVISION=${{ github.sha }} \
            --build-arg SOURCE_TIMESTAMP="$(git show -s --format=%cI HEAD)" \
            --output type=local,dest=/tmp/native-packager-docker-release .
      - name: Verify Docker release equals independently attested CI artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify /tmp/native-packager-docker-release/native-packager-release.v1.json \
            --repo ananta888/webrtc-minimize-server \
            --signer-workflow ananta888/webrtc-minimize-server/.github/workflows/ci.yml \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
      - name: Scan OCI archive for synthetic leakage canaries
        run: BROADCAST_LEAKAGE_SCOPE=image BROADCAST_IMAGE_ARCHIVE=/tmp/webrtc-minimize-server.oci.tar node scripts/broadcast-leakage-gate.mjs

  media-agent:
    name: Blind media agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Go modules with bounded retry
        working-directory: media-edge-agent
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Test native forwarder with race detection
        working-directory: media-edge-agent
        run: go test -race ./...
      - name: Vet native forwarder
        working-directory: media-edge-agent
        run: go vet ./...
      - name: Validate agent Compose configuration
        working-directory: media-edge-agent
        env:
          MEDIA_AGENT_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet
      - name: Build hardened agent image
        run: docker build --tag webrtc-media-edge-agent:ci media-edge-agent

  native-packager:
    name: Trusted native broadcast packager
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native-broadcast-packager/go.mod
          cache-dependency-path: native-broadcast-packager/go.sum
      - name: Download Go modules with bounded retry
        working-directory: native-broadcast-packager
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Test control daemon with race detection
        working-directory: native-broadcast-packager
        run: go test -race ./...
      - name: Vet control daemon
        working-directory: native-broadcast-packager
        run: go vet ./...
      - name: Reproducibly build supported artifacts
        working-directory: native-broadcast-packager
        run: |
          artifact_root="$RUNNER_TEMP/native-packager-artifacts"
          artifact_bin="$artifact_root/bin"
          mkdir -p "$artifact_bin"
          cp LICENSE.go-winio "$artifact_root/LICENSE.go-winio"
          build_timestamp=$(git show -s --format=%cI "$GITHUB_SHA")
          linker_flags="-s -w -X main.buildRevision=$GITHUB_SHA -X main.buildTimestamp=$build_timestamp"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-linux-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-linux-arm64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-macos-amd64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-macos-arm64" .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-windows-amd64.exe" .
          (cd "$artifact_bin" && sha256sum ./*) > "$artifact_root/sha256sums.txt"
          "$artifact_bin/native-broadcast-packager-linux-amd64" version > "$artifact_root/linux-amd64-build.json"
      - name: Build deterministic native release manifest
        run: node scripts/build-native-packager-release.mjs "$RUNNER_TEMP/native-packager-artifacts/bin" "$RUNNER_TEMP/native-packager-artifacts/linux-amd64-build.json"
      - name: Attest native packager binaries
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/native-packager-artifacts/bin/*
      - name: Verify release provenance policy
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$RUNNER_TEMP/native-packager-artifacts/bin/native-packager-release.v1.json" \
            --repo ananta888/webrtc-minimize-server \
            --signer-workflow ananta888/webrtc-minimize-server/.github/workflows/ci.yml \
            --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
      - name: Upload native packager binaries and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-broadcast-packager-${{ github.sha }}
          path: ${{ runner.temp }}/native-packager-artifacts
          if-no-files-found: error
          retention-days: 30

  infrastructure:
    name: Live Keycloak and TURN
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYCLOAK_ADMIN_PASSWORD: ci-local-admin-password
      TURN_SHARED_SECRET: ci-local-turn-secret
      LIVE_OIDC_USERNAME: webrtc-ci
      LIVE_OIDC_PASSWORD: ci-local-user-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start identity, signaling and relay stack
        run: docker compose --profile local --env-file .env.local.example up --detach --build
      - name: Prepare ephemeral Keycloak identity
        run: bash scripts/prepare-live-keycloak-user.sh
      - name: Verify PKCE, JWKS, tickets and a real TURN relay allocation
        env:
          RUN_LIVE_INFRASTRUCTURE: "1"
          LIVE_APP_ORIGIN: http://localhost:8080
          LIVE_OIDC_ISSUER: http://localhost:8081/realms/webrtc
        run: npm run test:infrastructure
      - name: Show stack logs after failure
        if: failure()
        run: docker compose --profile local --env-file .env.local.example logs --no-color --tail=200
      - name: Stop test stack
        if: always()
        run: docker compose --profile local --env-file .env.local.example down --volumes
