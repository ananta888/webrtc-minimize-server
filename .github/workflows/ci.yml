name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency graph
        run: npm audit --omit=dev
      - name: Install Chromium, Firefox and system dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Run todo, unit, integration and browser gates
        run: npm run check

  docker:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag webrtc-minimize-server:ci .

  infrastructure:
    name: Live Keycloak and TURN
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYCLOAK_ADMIN_PASSWORD: ci-local-admin-password
      TURN_SHARED_SECRET: ci-local-turn-secret
      LIVE_OIDC_USERNAME: webrtc-ci
      LIVE_OIDC_PASSWORD: ci-local-user-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start identity, signaling and relay stack
        run: docker compose up --detach --build
      - name: Prepare ephemeral Keycloak identity
        run: bash scripts/prepare-live-keycloak-user.sh
      - name: Verify PKCE, JWKS, tickets and a real TURN relay allocation
        env:
          RUN_LIVE_INFRASTRUCTURE: "1"
          LIVE_APP_ORIGIN: http://localhost:8080
          LIVE_OIDC_ISSUER: http://localhost:8081/realms/webrtc
        run: npm run test:infrastructure
      - name: Show stack logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes
