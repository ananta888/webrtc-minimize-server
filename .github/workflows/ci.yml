name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency graph
        run: npm audit --omit=dev
      - name: Install Chromium, Firefox and system dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Run todo, unit, integration and browser gates
        run: npm run check
      - name: Generate production dependency SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > webrtc-minimize-server.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webrtc-minimize-server-sbom
          path: webrtc-minimize-server.cdx.json
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile local --env-file .env.local.example config --quiet
      - name: Create attestation-capable BuildKit builder
        run: |
          docker buildx create --driver docker-container --name webrtc-ci-builder --use
          docker buildx inspect --bootstrap
      - name: Build production OCI archive with provenance and SBOM
        run: |
          docker buildx build --build-arg SOURCE_REVISION=${{ github.sha }} \
            --provenance=mode=max --sbom=true \
            --output type=oci,dest=/tmp/webrtc-minimize-server.oci.tar .
      - name: Scan OCI archive for synthetic leakage canaries
        run: BROADCAST_LEAKAGE_SCOPE=image BROADCAST_IMAGE_ARCHIVE=/tmp/webrtc-minimize-server.oci.tar node scripts/broadcast-leakage-gate.mjs

  media-agent:
    name: Blind media agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Go modules with bounded retry
        working-directory: media-edge-agent
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Test native forwarder with race detection
        working-directory: media-edge-agent
        run: go test -race ./...
      - name: Vet native forwarder
        working-directory: media-edge-agent
        run: go vet ./...
      - name: Validate agent Compose configuration
        working-directory: media-edge-agent
        env:
          MEDIA_AGENT_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet
      - name: Build hardened agent image
        run: docker build --tag webrtc-media-edge-agent:ci media-edge-agent

  native-packager:
    name: Trusted native broadcast packager
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: native-broadcast-packager/go.mod
          cache-dependency-path: native-broadcast-packager/go.sum
      - name: Download Go modules with bounded retry
        working-directory: native-broadcast-packager
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Test control daemon with race detection
        working-directory: native-broadcast-packager
        run: go test -race ./...
      - name: Vet control daemon
        working-directory: native-broadcast-packager
        run: go vet ./...
      - name: Reproducibly build supported artifacts
        working-directory: native-broadcast-packager
        run: |
          artifact_root="$RUNNER_TEMP/native-packager-artifacts"
          artifact_bin="$artifact_root/bin"
          mkdir -p "$artifact_bin"
          build_timestamp=$(git show -s --format=%cI "$GITHUB_SHA")
          linker_flags="-s -w -X main.buildRevision=$GITHUB_SHA -X main.buildTimestamp=$build_timestamp"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-linux-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-linux-arm64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-macos-amd64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-macos-arm64" .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$linker_flags" -o "$artifact_bin/native-broadcast-packager-windows-amd64.exe" .
          (cd "$artifact_bin" && sha256sum ./*) > "$artifact_root/sha256sums.txt"
          "$artifact_bin/native-broadcast-packager-linux-amd64" version > "$artifact_root/linux-amd64-build.json"
      - name: Attest native packager binaries
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/native-packager-artifacts/bin/*
      - name: Upload native packager binaries and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-broadcast-packager-${{ github.sha }}
          path: ${{ runner.temp }}/native-packager-artifacts
          if-no-files-found: error
          retention-days: 30

  infrastructure:
    name: Live Keycloak and TURN
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYCLOAK_ADMIN_PASSWORD: ci-local-admin-password
      TURN_SHARED_SECRET: ci-local-turn-secret
      LIVE_OIDC_USERNAME: webrtc-ci
      LIVE_OIDC_PASSWORD: ci-local-user-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start identity, signaling and relay stack
        run: docker compose --profile local --env-file .env.local.example up --detach --build
      - name: Prepare ephemeral Keycloak identity
        run: bash scripts/prepare-live-keycloak-user.sh
      - name: Verify PKCE, JWKS, tickets and a real TURN relay allocation
        env:
          RUN_LIVE_INFRASTRUCTURE: "1"
          LIVE_APP_ORIGIN: http://localhost:8080
          LIVE_OIDC_ISSUER: http://localhost:8081/realms/webrtc
        run: npm run test:infrastructure
      - name: Show stack logs after failure
        if: failure()
        run: docker compose --profile local --env-file .env.local.example logs --no-color --tail=200
      - name: Stop test stack
        if: always()
        run: docker compose --profile local --env-file .env.local.example down --volumes
