services:
  broadcast-gateway:
    environment:
      MTX_RTSP: "true"
      MTX_RTSPADDRESS: ":8554"
      MTX_PROTOCOLS: tcp
      MTX_WEBRTCALLOWORIGINS: '*'
      MTX_WEBRTCLOCALTCPADDRESS: ':8189'
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_ADDITIONAL_HOSTS:-127.0.0.1}
      MTX_AUTHINTERNALUSERS_0_USER: live-gate
      MTX_AUTHINTERNALUSERS_0_PASS: live-password
      MTX_AUTHINTERNALUSERS_0_IPS: 0.0.0.0/0
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: playback
      MTX_AUTHINTERNALUSERS_1_USER: any
      MTX_AUTHINTERNALUSERS_1_IPS: 0.0.0.0/0
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_2_ACTION: playback
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_3_ACTION: api
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_4_ACTION: metrics
    ports:
      - "127.0.0.1:${MEDIAMTX_TEST_RTSP_PORT:-18554}:8554/tcp"
      - "127.0.0.1:${MEDIAMTX_ICE_PORT:-18189}:8189/tcp"
