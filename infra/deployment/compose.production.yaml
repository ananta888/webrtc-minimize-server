services:
  webrtc:
    image: ${WEBRTC_IMAGE:-webrtc-minimize-server-webrtc:production}
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000
    pids_limit: 256
    ports: !reset []
    environment:
      BROADCAST_SIGNING_PRIVATE_KEY_FILE: /run/secrets/broadcast-signing-private-key.pem
    volumes:
      - ./.deploy/secrets/broadcast-signing-private-key.pem:/run/secrets/broadcast-signing-private-key.pem:ro
    networks: !override
      broadcast-origin:
      reverse-proxy:
        aliases:
          - webrtc-room-server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 20s

  native-packager:
    networks: !override
      default:
