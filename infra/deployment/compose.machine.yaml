# Optional, explicitly trusted machine admission. Never mount a Hub private key.
# Include only after the independent Hub/room policy and release gates are satisfied.
services:
  webrtc:
    environment:
      MACHINE_HUB_ISSUER: ${MACHINE_HUB_ISSUER:?Exact trusted Hub issuer required}
      MACHINE_HUB_PUBLIC_KEY_FILE: /run/secrets/machine-hub-public-key
      # Unlike :-, the - operator preserves an explicit empty deny-all ceiling.
      MACHINE_ALLOWED_CAPABILITIES: ${MACHINE_ALLOWED_CAPABILITIES-chat.read,chat.send}
    secrets:
      - source: machine-hub-public-key
        target: machine-hub-public-key

secrets:
  machine-hub-public-key:
    file: ${MACHINE_HUB_PUBLIC_KEY_FILE:?Ed25519 PUBLIC key file required}
