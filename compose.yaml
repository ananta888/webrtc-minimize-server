services:
  webrtc:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://webrtc.ananta.de}
      AUTH_MODE: ${AUTH_MODE:-required}
      KEYCLOAK_ORIGIN: ${KEYCLOAK_ORIGIN:-https://keycloak.ananta.de}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ananta}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-webrtc-room-server}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-webrtc-browser}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_REALM: ${TURN_REALM:-webrtc.ananta.de}
      TURN_CREDENTIAL_TTL_MS: ${TURN_CREDENTIAL_TTL_MS:-600000}
      EDGE_TURN_SERVERS_JSON: ${EDGE_TURN_SERVERS_JSON:-}
      PEER_EDGE_FALLBACK_MS: ${PEER_EDGE_FALLBACK_MS:-4000}
      INFRASTRUCTURE_TURN_FALLBACK_MS: ${INFRASTRUCTURE_TURN_FALLBACK_MS:-9000}
      MEDIA_E2EE_MODE: ${MEDIA_E2EE_MODE:-required}
      MAX_ROOM_PARTICIPANTS: ${MAX_ROOM_PARTICIPANTS:-20}
      PEER_MEDIA_RELAY_ENABLED: ${PEER_MEDIA_RELAY_ENABLED:-true}
      PEER_MEDIA_RELAY_MIN_PARTICIPANTS: ${PEER_MEDIA_RELAY_MIN_PARTICIPANTS:-6}
      PEER_MEDIA_RELAY_MAX_CHILDREN: ${PEER_MEDIA_RELAY_MAX_CHILDREN:-3}
      PEER_MEDIA_RELAY_MAX_HOPS: ${PEER_MEDIA_RELAY_MAX_HOPS:-3}
      PEER_ROUTE_LEASE_MS: ${PEER_ROUTE_LEASE_MS:-60000}
      PEER_ROUTE_RENEW_MS: ${PEER_ROUTE_RENEW_MS:-25000}
      PEER_RELAY_HEALTH_WINDOW_MS: ${PEER_RELAY_HEALTH_WINDOW_MS:-30000}
      PEER_RELAY_HEALTH_COOLDOWN_MS: ${PEER_RELAY_HEALTH_COOLDOWN_MS:-60000}
      PEER_DATA_OVERLAY_ENABLED: ${PEER_DATA_OVERLAY_ENABLED:-true}
      PAIR_WORKSPACE_ENABLED: ${PAIR_WORKSPACE_ENABLED:-true}
      PAIR_WORKSPACE_DB: ${PAIR_WORKSPACE_DB:-/app/data/pair-workspaces.sqlite}
      ACTIVE_SPEAKER_LIMIT: ${ACTIVE_SPEAKER_LIMIT:-5}
    volumes:
      - pair-workspaces:/app/data
    ports:
      - "${PORT:-8080}:8080"

  keycloak:
    profiles: ["local"]
    image: quay.io/keycloak/keycloak:26.6.1@sha256:dea26401d06341095cc4ea9d66896200b55de5ca1daa1d2fcbe58493afa6e0ad
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-development-only-change-me}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/webrtc-realm.json:/opt/keycloak/data/import/webrtc-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    security_opt:
      - no-new-privileges:true

  coturn:
    profiles: ["local"]
    image: coturn/coturn:4.6.3-r3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-local-development-only-change-me}
      - --realm=${TURN_REALM:-webrtc.local}
      - --server-name=${TURN_REALM:-webrtc.local}
      - --listening-port=3478
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --total-quota=${TURN_TOTAL_QUOTA:-2000}
      - --user-quota=${TURN_USER_QUOTA:-20}
      - --max-bps=${TURN_MAX_BPS:-8000000}
      - --stale-nonce=600
      - --log-file=stdout
      - --pidfile=
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=4m,uid=65534,gid=65534
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"

volumes:
  pair-workspaces:
