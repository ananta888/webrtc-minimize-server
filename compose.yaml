services:
  webrtc:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        SOURCE_TIMESTAMP: ${SOURCE_TIMESTAMP:-unknown}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://webrtc.ananta.de}
      AUTH_MODE: ${AUTH_MODE:-required}
      KEYCLOAK_ORIGIN: ${KEYCLOAK_ORIGIN:-https://keycloak.ananta.de}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ananta}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-webrtc-room-server}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-webrtc-browser}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_REALM: ${TURN_REALM:-webrtc.ananta.de}
      TURN_CREDENTIAL_TTL_MS: ${TURN_CREDENTIAL_TTL_MS:-600000}
      EDGE_TURN_SERVERS_JSON: ${EDGE_TURN_SERVERS_JSON:-}
      PEER_EDGE_FALLBACK_MS: ${PEER_EDGE_FALLBACK_MS:-4000}
      INFRASTRUCTURE_TURN_FALLBACK_MS: ${INFRASTRUCTURE_TURN_FALLBACK_MS:-9000}
      MEDIA_E2EE_MODE: ${MEDIA_E2EE_MODE:-required}
      MEDIA_EDGE_AGENTS_JSON: ${MEDIA_EDGE_AGENTS_JSON:-}
      MEDIA_AGENT_LEASE_MS: ${MEDIA_AGENT_LEASE_MS:-30000}
      MEDIA_AGENT_RENEW_MS: ${MEDIA_AGENT_RENEW_MS:-10000}
      MEDIA_AGENT_MAX_STANDBYS: ${MEDIA_AGENT_MAX_STANDBYS:-2}
      MEDIA_AGENT_MIN_PARTICIPANTS: ${MEDIA_AGENT_MIN_PARTICIPANTS:-3}
      MEDIA_AGENT_SHARD_MIN_PARTICIPANTS: ${MEDIA_AGENT_SHARD_MIN_PARTICIPANTS:-6}
      MEDIA_AGENT_TAKEOVER_TTL_MS: ${MEDIA_AGENT_TAKEOVER_TTL_MS:-20000}
      MEDIA_AGENT_RATE_LIMIT: ${MEDIA_AGENT_RATE_LIMIT:-2000}
      MEDIA_AGENT_SELF_SERVICE_ENABLED: ${MEDIA_AGENT_SELF_SERVICE_ENABLED:-true}
      MEDIA_AGENT_REGISTRATION_DB: ${MEDIA_AGENT_REGISTRATION_DB:-/app/data/media-agent-registrations.sqlite}
      MEDIA_AGENT_ARTIFACT_DIR: ${MEDIA_AGENT_ARTIFACT_DIR:-/app/media-agent-downloads}
      MEDIA_AGENT_ENROLLMENT_TTL_MS: ${MEDIA_AGENT_ENROLLMENT_TTL_MS:-600000}
      MEDIA_AGENT_MAX_PER_PRINCIPAL: ${MEDIA_AGENT_MAX_PER_PRINCIPAL:-3}
      MEDIA_AGENT_ENROLLMENT_RATE_LIMIT: ${MEDIA_AGENT_ENROLLMENT_RATE_LIMIT:-5}
      NATIVE_PACKAGER_SELF_SERVICE_ENABLED: ${NATIVE_PACKAGER_SELF_SERVICE_ENABLED:-true}
      NATIVE_PACKAGER_REGISTRATION_DB: ${NATIVE_PACKAGER_REGISTRATION_DB:-/app/data/native-packager-registrations.sqlite}
      NATIVE_PACKAGER_ARTIFACT_DIR: ${NATIVE_PACKAGER_ARTIFACT_DIR:-/app/native-packager-downloads}
      NATIVE_PACKAGER_ENROLLMENT_TTL_MS: ${NATIVE_PACKAGER_ENROLLMENT_TTL_MS:-600000}
      NATIVE_PACKAGER_MAX_PER_PRINCIPAL: ${NATIVE_PACKAGER_MAX_PER_PRINCIPAL:-3}
      SIGNAL_RATE_LIMIT: ${SIGNAL_RATE_LIMIT:-300}
      MAX_ROOM_PARTICIPANTS: ${MAX_ROOM_PARTICIPANTS:-20}
      PEER_MEDIA_RELAY_ENABLED: ${PEER_MEDIA_RELAY_ENABLED:-true}
      PEER_MEDIA_RELAY_MIN_PARTICIPANTS: ${PEER_MEDIA_RELAY_MIN_PARTICIPANTS:-3}
      PEER_MEDIA_RELAY_MAX_CHILDREN: ${PEER_MEDIA_RELAY_MAX_CHILDREN:-3}
      PEER_MEDIA_RELAY_MAX_HOPS: ${PEER_MEDIA_RELAY_MAX_HOPS:-3}
      PEER_ROUTE_LEASE_MS: ${PEER_ROUTE_LEASE_MS:-60000}
      PEER_ROUTE_RENEW_MS: ${PEER_ROUTE_RENEW_MS:-25000}
      PEER_RELAY_HEALTH_WINDOW_MS: ${PEER_RELAY_HEALTH_WINDOW_MS:-30000}
      PEER_RELAY_HEALTH_COOLDOWN_MS: ${PEER_RELAY_HEALTH_COOLDOWN_MS:-60000}
      PEER_DATA_OVERLAY_ENABLED: ${PEER_DATA_OVERLAY_ENABLED:-true}
      PAIR_WORKSPACE_ENABLED: ${PAIR_WORKSPACE_ENABLED:-true}
      PAIR_WORKSPACE_DB: ${PAIR_WORKSPACE_DB:-/app/data/pair-workspaces.sqlite}
      ACTIVE_SPEAKER_LIMIT: ${ACTIVE_SPEAKER_LIMIT:-5}
      BROADCAST_NATIVE_OUTPUT_ENABLED: ${BROADCAST_NATIVE_OUTPUT_ENABLED:-false}
      BROADCAST_WHIP_ENDPOINT: ${BROADCAST_WHIP_ENDPOINT:-}
      BROADCAST_WHIP_RESOURCE_BASE: ${BROADCAST_WHIP_RESOURCE_BASE:-}
      BROADCAST_WHIP_PROFILE: ${BROADCAST_WHIP_PROFILE:-rfc9725}
      BROADCAST_WHIP_REDIRECT_ORIGINS: ${BROADCAST_WHIP_REDIRECT_ORIGINS:-}
      BROADCAST_WHIP_TRICKLE_ICE: ${BROADCAST_WHIP_TRICKLE_ICE:-true}
      BROADCAST_WHIP_SIMULCAST_ENABLED: ${BROADCAST_WHIP_SIMULCAST_ENABLED:-false}
      BROADCAST_WHIP_AUDIO_CODECS: ${BROADCAST_WHIP_AUDIO_CODECS:-audio/opus}
      BROADCAST_WHIP_VIDEO_CODECS: ${BROADCAST_WHIP_VIDEO_CODECS:-video/vp8,video/h264}
      BROADCAST_WHIP_REQUEST_TIMEOUT_MS: ${BROADCAST_WHIP_REQUEST_TIMEOUT_MS:-8000}
      BROADCAST_WHIP_ICE_GATHERING_TIMEOUT_MS: ${BROADCAST_WHIP_ICE_GATHERING_TIMEOUT_MS:-10000}
      BROADCAST_WHIP_CONNECTION_TIMEOUT_MS: ${BROADCAST_WHIP_CONNECTION_TIMEOUT_MS:-20000}
      BROADCAST_WHIP_RETRY_BUDGET: ${BROADCAST_WHIP_RETRY_BUDGET:-1}
      BROADCAST_GATEWAY_AUTH_ENABLED: ${BROADCAST_GATEWAY_AUTH_ENABLED:-false}
      BROADCAST_GATEWAY_AUTH_ADDRESSES: ${BROADCAST_GATEWAY_AUTH_ADDRESSES:-127.0.0.1,::1}
      BROADCAST_GATEWAY_ORIGIN: ${BROADCAST_GATEWAY_ORIGIN:-}
      BROADCAST_SIGNING_PRIVATE_KEY_FILE: ${BROADCAST_SIGNING_PRIVATE_KEY_FILE:-}
      BROADCAST_SIGNING_KEY_ID: ${BROADCAST_SIGNING_KEY_ID:-broadcast-control-1}
    volumes:
      - pair-workspaces:/app/data
    networks:
      default:
      broadcast-origin:
    ports:
      - "${WEBRTC_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"

  native-packager:
    profiles: ["native-packager"]
    build:
      context: .
      target: native-packager-runtime
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        SOURCE_TIMESTAMP: ${SOURCE_TIMESTAMP:-unknown}
    image: ${NATIVE_PACKAGER_IMAGE:-webrtc-minimize-server-native-packager:local}
    restart: unless-stopped
    environment:
      NATIVE_PACKAGER_CONTROL_URL: ${NATIVE_PACKAGER_CONTROL_URL:-wss://webrtc.ananta.de/native-packager}
      NATIVE_PACKAGER_ID: ${NATIVE_PACKAGER_ID:-}
      NATIVE_PACKAGER_IDENTITY_FILE: /var/lib/ananta-native-packager/identity.pem
      NATIVE_PACKAGER_OUTPUT_ROOT: /var/lib/ananta-broadcast-output
      NATIVE_PACKAGER_STUN_URLS: ${NATIVE_PACKAGER_STUN_URLS:-}
      NATIVE_PACKAGER_ICE_TRANSPORT_POLICY: ${NATIVE_PACKAGER_ICE_TRANSPORT_POLICY:-all}
      NATIVE_PACKAGER_LABEL: ${NATIVE_PACKAGER_LABEL:-Mini-PC Broadcast-Packager}
      NATIVE_PACKAGER_PLATFORM: linux
      NATIVE_PACKAGER_ENERGY_CLASS: ${NATIVE_PACKAGER_ENERGY_CLASS:-ac}
      NATIVE_PACKAGER_UPLOAD_CLASS: ${NATIVE_PACKAGER_UPLOAD_CLASS:-5-15mbit}
      NATIVE_PACKAGER_MAX_RENDITIONS: ${NATIVE_PACKAGER_MAX_RENDITIONS:-2}
      NATIVE_PACKAGER_MAX_PIXELS_PER_SECOND: ${NATIVE_PACKAGER_MAX_PIXELS_PER_SECOND:-27648000}
    volumes:
      - native-packager-state:/var/lib/ananta-native-packager
      - native-broadcast-output:/var/lib/ananta-broadcast-output
    networks:
      default:
      broadcast-origin:
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 20s

  broadcast-hls-origin:
    profiles: ["native-packager"]
    build:
      context: .
      target: broadcast-hls-origin-runtime
    image: ${BROADCAST_HLS_ORIGIN_IMAGE:-webrtc-minimize-server-broadcast-hls-origin:local}
    restart: unless-stopped
    depends_on:
      native-packager:
        condition: service_started
    environment:
      BROADCAST_ORIGIN_ROOT: /var/lib/ananta-broadcast-output
      BROADCAST_ORIGIN_ADDRESS: :8081
    volumes:
      - native-broadcast-output:/var/lib/ananta-broadcast-output:ro
    networks:
      broadcast-origin:
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/broadcast-hls-origin", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    stop_grace_period: 10s

  keycloak:
    profiles: ["local"]
    image: quay.io/keycloak/keycloak:26.6.1@sha256:dea26401d06341095cc4ea9d66896200b55de5ca1daa1d2fcbe58493afa6e0ad
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-development-only-change-me}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/webrtc-realm.json:/opt/keycloak/data/import/webrtc-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    security_opt:
      - no-new-privileges:true

  coturn:
    profiles: ["local"]
    image: coturn/coturn:4.6.3-r3@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-local-development-only-change-me}
      - --realm=${TURN_REALM:-webrtc.local}
      - --server-name=${TURN_REALM:-webrtc.local}
      - --listening-port=3478
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --total-quota=${TURN_TOTAL_QUOTA:-2000}
      - --user-quota=${TURN_USER_QUOTA:-20}
      - --max-bps=${TURN_MAX_BPS:-8000000}
      - --stale-nonce=600
      - --log-file=stdout
      - --pidfile=
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=4m,uid=65534,gid=65534
    ports:
      - "${TURN_PORT:-3478}:3478/udp"
      - "${TURN_PORT:-3478}:3478/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"

volumes:
  pair-workspaces:
  native-packager-state:
  native-broadcast-output:

networks:
  broadcast-origin:
    internal: true
