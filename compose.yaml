services:
  webrtc:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}
      TURN_SERVERS_JSON: ${TURN_SERVERS_JSON:-[]}
      MAX_ROOM_PARTICIPANTS: ${MAX_ROOM_PARTICIPANTS:-4}
    ports:
      - "${PORT:-8080}:8080"
